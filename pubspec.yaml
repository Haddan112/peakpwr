name: gym_log
description: A gym workout logger.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  lottie: ^3.1.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  uuid: ^4.0.0
  video_player: ^2.9.2
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  easy_localization: ^3.0.7
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1   # <-- أضف هذا السطر

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/translations/
    - assets/animations/
    - assets/icon/                    # <-- أضف هذا السطر (اختياري لكن مفيد)
    - assets/sounds/

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/barbell.png"